name: Build blog

on:
  push:
    branches: [main]
    paths:
      - "blog-src/**"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: blog-src
        run: npm ci

      - name: Build blog
        working-directory: blog-src
        run: npm run build

      - name: Sync build output into /blog
        run: |
          rm -rf blog
          mkdir -p blog/admin
          cp -r blog-src/dist/blog/. blog/
          cp -r blog-src/dist/admin/. blog/admin/

      - name: Commit built blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog
          git diff --staged --quiet && echo "No changes" || git commit -m "Build blog [skip ci]"
          git push
