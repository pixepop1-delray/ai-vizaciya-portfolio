name: Build blog

on:
  push:
    branches: [main]
    paths:
      - "blog-src/**"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch:

concurrency:
  group: build-blog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: blog-src
        run: npm ci

      - name: Build blog
        working-directory: blog-src
        run: npm run build

      - name: Sync build output into /blog and /images
        run: |
          rm -rf blog
          mkdir -p blog/admin images
          cp -r blog-src/dist/blog/. blog/
          cp -r blog-src/dist/admin/. blog/admin/
          if [ -d blog-src/dist/images ]; then cp -r blog-src/dist/images/. images/; fi

      - name: Commit built blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog images
          git diff --staged --quiet && echo "No changes" || git commit -m "Build blog [skip ci]"
          git push
